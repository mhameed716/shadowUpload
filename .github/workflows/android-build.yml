name: Android Build

# بناء التطبيق على GitHub Actions (بلا حاجة لأي بيئة محلية)
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: بناء APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle (مع التخزين المؤقت)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # تنزيل Gradle الرسمي ثم توليد gradlew + gradle-wrapper.jar داخل السير
      - name: تجهيز Gradle Wrapper
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt/
          export PATH=/opt/gradle-8.7/bin:$PATH
          gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon
          chmod +x ./gradlew
          ls -la gradle/wrapper/

      - name: فحص الموارد والكود (أداة المشروع)
        run: |
          python3 -m pip install --quiet tree_sitter tree_sitter_kotlin
          python3 tools/verify.py
          python3 tools/audit_deep.py

      - name: بناء نسخة التصحيح
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: بناء نسخة الإصدار (R8)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: رفع APK التصحيح
        uses: actions/upload-artifact@v4
        with:
          name: shadowUpload-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: رفع APK الإصدار
        uses: actions/upload-artifact@v4
        with:
          name: shadowUpload-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: حفظ سجلات الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
